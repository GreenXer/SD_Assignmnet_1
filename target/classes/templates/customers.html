<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Customer List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CRM System</a>
            <div class="navbar-nav ms-auto">
                <span class="nav-link text-light me-3" sec:authorize="isAuthenticated()">
                    Logged in as: <strong sec:authentication="name"></strong>
                </span>
                <a sec:authorize="!isAuthenticated()" class="btn btn-primary btn-sm" th:href="@{/login}">Login</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Customer Management</h2>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <!-- Additional Feature: Search -->
                <form th:action="@{/customers}" method="get" class="d-flex">
                    <input type="text" name="search" class="form-control me-2" placeholder="Search by name..." th:value="${search}">
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                    <a th:href="@{/customers}" class="btn btn-link">Reset</a>
                </form>
            </div>
            <div class="col-md-6 text-end">
                <span class="dropdown">
                  <button class="btn btn-secondary dropdown-toggle" type="button" id="exportMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                    Export As...
                  </button>
                  <ul class="dropdown-menu" aria-labelledby="exportMenuButton">
                    <li><a class="dropdown-item" th:href="@{/customers/export(format='json', search=${search})}">JSON</a></li>
                    <li><a class="dropdown-item" th:href="@{/customers/export(format='xml', search=${search})}">XML</a></li>
                    <li><a class="dropdown-item" th:href="@{/customers/export(format='csv', search=${search})}">CSV</a></li>
                  </ul>
                </span>
                <span sec:authorize="hasAnyRole('EMPLOYEE', 'ADMIN')">
                    <a th:href="@{/customers/new}" class="btn btn-success ms-2">Add New Customer</a>
                </span>
            </div>
        </div>

        <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Company</th>
                    <th sec:authorize="hasAnyRole('EMPLOYEE', 'ADMIN')">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cust : ${customers}">
                    <td th:text="${cust.id}"></td>
                    <td th:text="${cust.name}"></td>
                    <td th:text="${cust.email}"></td>
                    <td th:text="${cust.phone}"></td>
                    <td th:text="${cust.company}"></td>
                    <td sec:authorize="hasAnyRole('EMPLOYEE', 'ADMIN')">
                        <a th:href="@{/customers/edit/{id}(id=${cust.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/customers/delete/{id}(id=${cust.id})}" 
                           class="btn btn-danger btn-sm" 
                           sec:authorize="hasRole('ADMIN')"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div th:if="${customers.empty}" class="alert alert-info">
            No customers found.
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle with Popper (required for Dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
