<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 th:text="${customer.id == null ? 'Add New Customer' : 'Edit Customer'}">Customer Form</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/customers/save}" th:object="${customer}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" th:field="*{phone}" class="form-control">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <input type="text" th:field="*{company}" class="form-control">
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success">Save Customer</button>
                        <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
